<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Index</title>
</head>
<body>
    <div class="container">
        <h1>BMI calculator</h1>
        <form>
            <p>
                <label>Height in CM: </label><input type="text" id="height">
            </p>
            <p>
                <label>Weigth in KG: </label><input type="text" id="weight">
            </p>
            <button>Calculate</button>
            <div id="result"></div>
            <br>
            <div id="weight-guide">
                <h3>BMI weigth guide</h3>
                <p>Under weight = less than 18.6</p>

            </div>
        </form>
    </div>
</body>
<script src="BmiIndex.js"></script>
</html>
